# Read about `build.yaml` at https://pub.dev/packages/build_config
builders:
  style_builder:
    import: "package:style_generator/style_generator.dart"
    builder_factories: [ "styleBuilder" ]
    build_extensions: { ".dart": [ ".style.dart" ] }
    build_to: source
    auto_apply: root_package
    defaults:
      options:
        run_only_if_triggered: true
        constructor: null
        fallback: null
        gen_copy_with: true
        gen_merge: true
        gen_lerp: true
        gen_of: null
        suffix: null
  copy_with_builder:
    import: "package:style_generator/style_generator.dart"
    builder_factories: [ "copyWithBuilder" ]
    build_extensions: { ".dart": [ ".copy_with.dart" ] }
    build_to: source
    auto_apply: root_package
    defaults:
      options:
        run_only_if_triggered: true
        constructor: null
        asExtension: null
        suffix: Cw
  equality_builder:
    import: "package:style_generator/style_generator.dart"
    builder_factories: [ "equalityBuilder" ]
    build_extensions: { ".dart": [ ".equality.dart" ] }
    build_to: source
    auto_apply: root_package
    defaults:
      options:
        run_only_if_triggered: true
        constructor: null
        suffix: "Equality"
  to_string_builder:
    import: "package:style_generator/style_generator.dart"
    builder_factories: [ "toStringBuilder" ]
    build_extensions: { ".dart": [ ".to_string.dart" ] }
    build_to: source
    auto_apply: root_package
    defaults:
      options:
        run_only_if_triggered: true
        suffix: "Ts"

triggers:
  style_generator:style_builder:
    - annotation Style
  style_generator:copy_with_builder:
    - annotation CopyWith
  style_generator:equality_builder:
    - annotation Equality
  style_generator:to_string_builder:
    - annotation ToString